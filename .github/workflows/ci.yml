name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Preparar banco de testes
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE imovel_owner LOGIN PASSWORD 'owner_dev_pw';"
          psql -h localhost -U postgres -c "CREATE ROLE imovel_app LOGIN PASSWORD 'app_dev_pw';"
          psql -h localhost -U postgres -c "CREATE DATABASE imoveladmin_test OWNER imovel_owner;"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
